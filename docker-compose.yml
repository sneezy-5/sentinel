services:
  # Local TimescaleDB for development. central-server's application.yaml points here by
  # default (localhost:5432), so `docker compose up -d` + `./mvnw -pl central-server spring-boot:run`
  # is enough to get a working local setup after cloning.
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
    ports:
      - "5432:5432"
    volumes:
      - sentinel-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sentinel-db-data:
