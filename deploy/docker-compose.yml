# Production stack: central-server + TimescaleDB + Caddy (automatic HTTPS).
#
# central-server is pulled pre-built from GHCR (see .github/workflows/central-server-release.yml)
# rather than built locally - no JDK/Maven needed on the server this runs on:
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
#
# Already running nginx/another reverse proxy on 80/443 on this host? Don't bring up
# `caddy` at all - it'll fail to bind those ports. Instead:
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d timescaledb central-server
# central-server is bound to 127.0.0.1:8080 (see below), so point your existing reverse
# proxy at that - see deploy/nginx-central-server.conf.example for a ready-to-adapt vhost.
#
# If the image pull fails with "denied"/"unauthorized": the GHCR package is probably still
# private (Actions-published packages default to private even in a public repo) - go to
# the package's settings on GitHub and set visibility to public, or `docker login ghcr.io`
# with a PAT that has read:packages first.
#
# Requires a deploy/.env file (see deploy/.env.example) and a DNS A record for
# SENTINEL_DOMAIN pointing at this host - Caddy needs that to issue a Let's Encrypt cert.
#
# After the FIRST boot (once central-server has created its tables via ddl-auto=update),
# run deploy/init-hypertables.sql once to convert them into real TimescaleDB hypertables -
# it can't run any earlier, the tables don't exist yet at container init time. See the
# "Deploying to production" section of the root README for the exact command.

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in deploy/.env}
    volumes:
      - sentinel-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  central-server:
    image: ghcr.io/sneezy-5/sentinel-central-server:latest
    # For local iteration on central-server's own code instead of pulling a release,
    # comment out `image:` above and use this instead:
    # build:
    #   context: ..
    #   dockerfile: central-server/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://timescaledb:5432/sentinel
      SPRING_DATASOURCE_USERNAME: sentinel
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in deploy/.env}
      # ddl-auto stays "update" here too: the hypertable conversion above only runs once,
      # against tables Hibernate itself creates on first boot - see init-hypertables.sql.
      SENTINEL_PUBLIC_URL: https://${SENTINEL_DOMAIN:?set SENTINEL_DOMAIN in deploy/.env}
    ports:
      # Bound to loopback only, not the public interface: real traffic must go through
      # Caddy (TLS). This just lets you reach it via an SSH tunnel for debugging, or
      # locally if you're running the stack on your own machine.
      - "127.0.0.1:8080:8080"
    volumes:
      # Optional: only needed if you want to self-host the agent binaries instead of the
      # default (GitHub Releases, see install.sh) - e.g. monitored servers without
      # outbound access to github.com. Safe to leave empty (see WebConfig).
      - ./downloads:/opt/sentinel/downloads:ro
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      SENTINEL_DOMAIN: ${SENTINEL_DOMAIN:?set SENTINEL_DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - central-server
    restart: unless-stopped

volumes:
  sentinel-db-data:
  caddy-data:
