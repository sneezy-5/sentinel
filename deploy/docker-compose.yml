# Production stack: central-server + TimescaleDB + Caddy (automatic HTTPS).
#
# Run from the repo root (Caddy/central-server Dockerfiles need core/ + central-server/
# in the build context):
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
#
# Requires a deploy/.env file (see deploy/.env.example) and a DNS A record for
# SENTINEL_DOMAIN pointing at this host - Caddy needs that to issue a Let's Encrypt cert.
#
# After the FIRST boot (once central-server has created its tables via ddl-auto=update),
# run deploy/init-hypertables.sql once to convert them into real TimescaleDB hypertables -
# it can't run any earlier, the tables don't exist yet at container init time. See the
# "Deploying to production" section of the root README for the exact command.

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in deploy/.env}
    volumes:
      - sentinel-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  central-server:
    build:
      context: ..
      dockerfile: central-server/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://timescaledb:5432/sentinel
      SPRING_DATASOURCE_USERNAME: sentinel
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in deploy/.env}
      # ddl-auto stays "update" here too: the hypertable conversion above only runs once,
      # against tables Hibernate itself creates on first boot - see init-hypertables.sql.
      SENTINEL_PUBLIC_URL: https://${SENTINEL_DOMAIN:?set SENTINEL_DOMAIN in deploy/.env}
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      SENTINEL_DOMAIN: ${SENTINEL_DOMAIN:?set SENTINEL_DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - central-server
    restart: unless-stopped

volumes:
  sentinel-db-data:
  caddy-data:
