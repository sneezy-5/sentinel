name: agent-native-c-build

# Builds the C `agent-native` module (amd64 and arm64) via its Makefile - not to be
# confused with `agent-jvm-native-build.yml`, which builds the Java `agent` module's
# GraalVM binary. Both are needed by install.sh (architecture doc, section 5.1).
#
# No cross-compilation: built directly on a runner matching each target arch (gcc/make
# come preinstalled on GitHub-hosted ubuntu runners, no extra setup needed).
#
# Triggered on the same "v*" tag as agent-jvm-native-build.yml and central-server-release.yml
# (one version tag = one release), and uploads its binary as a release asset so install.sh
# can fetch it from https://github.com/<repo>/releases/latest/download/... without auth.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          cd agent-native
          make

      - name: Rename for release
        run: cp agent-native/bin/sentinel-native sentinel-native-linux-${{ matrix.arch }}

      - name: Publish to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: sentinel-native-linux-${{ matrix.arch }}
          fail_on_unmatched_files: true
