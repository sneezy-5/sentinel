name: agent-jvm-native-build

# Builds a GraalVM native binary for the Java `agent` module (amd64 and arm64) - not to be
# confused with `agent-native-c-build.yml`, which builds the separate C `agent-native`
# module. Two different binaries, both needed by install.sh (architecture doc, section 5.1).
#
# native-image doesn't cross-compile (see agent/Dockerfile.native): each arch is therefore
# built on a runner of that same arch, not through a single job that varies a parameter.
# ubuntu-24.04-arm is a native arm64 runner hosted by GitHub (public repos); if it's not
# available on this account/plan, replace this job with a buildx + QEMU build (slower, to
# be treated as unvalidated for production without explicit testing).
#
# Triggered on the same "v*" tag as agent-native-c-build.yml and central-server-release.yml
# (one version tag = one release), and uploads its binary as a release asset so install.sh
# can fetch it from https://github.com/<repo>/releases/latest/download/... without auth.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    # softprops/action-gh-release races badly if multiple jobs create/update the same
    # release concurrently - this matrix, plus agent-native-c-build.yml's own matrix, are
    # 4 jobs total all touching the same tag's release. Same concurrency group as that
    # workflow's job serializes all of them (cancel-in-progress: false means they queue,
    # not cancel each other).
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install GraalVM (muslib for a static binary)
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: "17"
          distribution: "graalvm"
          native-image-musl: "true"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the agent's native binary
        run: |
          chmod +x mvnw
          ./mvnw -pl agent -am -Pnative -DskipTests package

      - name: Rename for release
        run: cp agent/target/sentinel-agent sentinel-agent-linux-${{ matrix.arch }}

      - name: Publish to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: sentinel-agent-linux-${{ matrix.arch }}
          fail_on_unmatched_files: true
