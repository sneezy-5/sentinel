name: central-server-release

# Builds central-server's Docker image and pushes it to GHCR on a version tag, so
# `docker pull ghcr.io/<owner>/<repo>-central-server:<tag>` works for anyone self-hosting
# without needing a JDK or Maven locally.
#
# Same "v*" tag as agent-jvm-native-build.yml and agent-native-c-build.yml: one version
# tag builds and publishes all three artifacts together.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: central-server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-central-server:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}-central-server:latest
